<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Pedido - Patitas Felices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-emerald-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1">
        <section class="max-w-4xl mx-auto px-4 py-8">
            <nav class="text-sm text-emerald-700 mb-8">
                <a href="perfil.html" class="hover:text-emerald-900">Mi Perfil</a> /
                <span class="text-emerald-900" id="breadcrumb-id">Detalle del Pedido</span>
            </nav>

            <div id="order-content"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        const orderId = getUrlParam('id');
        const container = document.getElementById('order-content');
        document.getElementById('breadcrumb-id').textContent = orderId || 'Detalle del Pedido';

        const mockOrder = MOCK_DATA.orders.find(o => o.id === orderId);
        const customOrders = JSON.parse(localStorage.getItem('mascotas_orders') || '[]');
        const customOrder = customOrders.find(o => o.id === orderId);
        const order = customOrder || mockOrder;

        if (!order) {
            container.innerHTML = `
                <div class="text-center py-16">
                    <div class="text-6xl mb-4">📦</div>
                    <h2 class="text-2xl font-bold text-emerald-900 mb-2">Pedido no encontrado</h2>
                    <a href="perfil.html" class="text-emerald-700 hover:underline mt-4 inline-block">Volver a Mi Perfil</a>
                </div>`;
        } else {
            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-8 mb-8">
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                        <div>
                            <h1 class="text-2xl font-bold text-emerald-900">Pedido ${order.id}</h1>
                            <p class="text-emerald-600">${formatDate(order.date)}</p>
                        </div>
                        <span class="px-4 py-2 rounded-full font-medium ${getStatusColor(order.status)}">${order.status}</span>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6 mb-8">
                        <div class="bg-emerald-50 rounded-lg p-4">
                            <h3 class="font-bold text-emerald-900 mb-2">Información de Envío</h3>
                            <p class="text-emerald-800 text-sm">${order.address || 'Dirección no disponible'}</p>
                            <p class="text-emerald-700 text-sm mt-1">Método: ${order.shippingMethod}</p>
                        </div>
                        <div class="bg-emerald-50 rounded-lg p-4">
                            <h3 class="font-bold text-emerald-900 mb-2">Pago</h3>
                            <p class="text-emerald-800 text-sm">${order.paymentMethod}</p>
                        </div>
                    </div>

                    <h2 class="text-xl font-bold text-emerald-900 mb-4">Productos</h2>
                    <div class="space-y-4 mb-8">
                        ${order.items.map(item => `
                            <div class="flex items-center gap-4 p-4 bg-emerald-50 rounded-lg">
                                <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-lg">
                                <div class="flex-1">
                                    <h3 class="font-bold text-emerald-900">
                                        <a href="producto-detalle.html?id=${item.productId}" class="hover:text-emerald-700">${item.name}</a>
                                    </h3>
                                    <p class="text-emerald-600 text-sm">${item.quantity} x ${formatPrice(item.price)}</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-bold text-emerald-700">${formatPrice(item.price * item.quantity)}</p>
                                    <a href="resena.html?productId=${item.productId}" class="text-sm text-emerald-600 hover:text-emerald-800 hover:underline">Escribir reseña</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="border-t border-emerald-100 pt-6 space-y-2">
                        <div class="flex justify-between text-emerald-800">
                            <span>Subtotal</span>
                            <span>${formatPrice(order.subtotal)}</span>
                        </div>
                        <div class="flex justify-between text-emerald-800">
                            <span>Envío</span>
                            <span>${order.shipping === 0 ? 'Gratis' : formatPrice(order.shipping)}</span>
                        </div>
                        <div class="flex justify-between text-xl font-bold text-emerald-900 pt-2 border-t border-emerald-100">
                            <span>Total</span>
                            <span>${formatPrice(order.total)}</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-4">
                    <a href="perfil.html" class="bg-emerald-700 text-white px-6 py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Volver a Pedidos</a>
                    <button onclick="window.print()" class="bg-white text-emerald-700 border-2 border-emerald-700 px-6 py-3 rounded-lg font-bold hover:bg-emerald-100 transition-colors no-print">Imprimir</button>
                </div>`;
        }
    </script>
</body>
</html>
