<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escribir Reseña - Patitas Felices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-emerald-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1">
        <section class="max-w-3xl mx-auto px-4 py-8">
            <nav class="text-sm text-emerald-700 mb-8">
                <a href="index.html" class="hover:text-emerald-900">Inicio</a> /
                <span class="text-emerald-900">Escribir Reseña</span>
            </nav>

            <div id="review-content"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        const productId = parseInt(getUrlParam('productId'));
        const product = MOCK_DATA.products.find(p => p.id === productId);
        const container = document.getElementById('review-content');

        if (!product) {
            container.innerHTML = `
                <div class="text-center py-16">
                    <div class="text-6xl mb-4">😕</div>
                    <h2 class="text-2xl font-bold text-emerald-900 mb-2">Producto no encontrado</h2>
                    <a href="productos.html" class="text-emerald-700 hover:underline">Volver a productos</a>
                </div>`;
        } else {
            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-8">
                    <h1 class="text-2xl font-bold text-emerald-900 mb-6">Escribir Reseña</h1>

                    <div class="flex items-center gap-4 mb-8 p-4 bg-emerald-50 rounded-lg">
                        <img src="${product.image}" alt="${product.name}" class="w-16 h-16 object-cover rounded-lg">
                        <div>
                            <h2 class="font-bold text-emerald-900">${product.name}</h2>
                            <p class="text-emerald-700">${formatPrice(product.price)}</p>
                        </div>
                    </div>

                    <form id="review-form" class="space-y-6">
                        <div>
                            <label class="block text-emerald-800 font-bold mb-3">Tu Calificación</label>
                            <div class="flex items-center gap-1" id="star-rating">
                                ${[1,2,3,4,5].map(i => `
                                    <label class="cursor-pointer">
                                        <input type="radio" name="rating" value="${i}" class="hidden peer" required>
                                        <svg class="w-10 h-10 peer-checked:text-yellow-400 text-gray-300 transition-colors hover:text-yellow-300" fill="currentColor" viewBox="0 0 20 20">
                                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                        </svg>
                                    </label>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <label class="block text-emerald-800 font-bold mb-2">Tu Nombre</label>
                            <input type="text" required class="w-full px-4 py-3 border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Tu nombre" value="${Auth.getCurrentUser()?.name || ''}">
                        </div>

                        <div>
                            <label class="block text-emerald-800 font-bold mb-2">Tu Reseña</label>
                            <textarea required rows="5" class="w-full px-4 py-3 border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Cuéntanos tu experiencia con este producto..."></textarea>
                        </div>

                        <div class="flex gap-4">
                            <button type="submit" class="bg-emerald-700 text-white px-8 py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Enviar Reseña</button>
                            <a href="producto-detalle.html?id=${product.id}" class="bg-white text-emerald-700 border-2 border-emerald-700 px-8 py-3 rounded-lg font-bold hover:bg-emerald-100 transition-colors">Cancelar</a>
                        </div>
                    </form>
                </div>`;

            document.getElementById('review-form').addEventListener('submit', (e) => {
                e.preventDefault();
                showToast('¡Gracias por tu reseña! Ha sido publicada exitosamente.', 'success');
                setTimeout(() => {
                    window.location.href = `producto-detalle.html?id=${product.id}`;
                }, 1500);
            });
        }
    </script>
</body>
</html>
