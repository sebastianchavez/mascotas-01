<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Patitas Felices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-emerald-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1">
        <section class="bg-gradient-to-r from-emerald-700 to-emerald-800 text-white py-12">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <h1 class="text-4xl font-extrabold">Mi Perfil</h1>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-4 py-8">
            <div id="profile-content"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        const user = Auth.getCurrentUser();
        const container = document.getElementById('profile-content');

        if (!user) {
            container.innerHTML = `
                <div class="text-center py-16">
                    <div class="text-6xl mb-4">🔒</div>
                    <h2 class="text-2xl font-bold text-emerald-900 mb-2">Debes iniciar sesión</h2>
                    <p class="text-emerald-700 mb-6">Inicia sesión para ver tu perfil y pedidos</p>
                    <a href="login.html" class="bg-emerald-700 text-white px-8 py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Iniciar Sesión</a>
                </div>`;
        } else {
            const orders = Auth.getUserOrders();
            const customOrders = JSON.parse(localStorage.getItem('mascotas_orders') || '[]').filter(o => {
                const currentUser = Auth.getCurrentUser();
                return currentUser;
            });
            const allOrders = [...customOrders, ...orders];

            container.innerHTML = `
                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="bg-white rounded-xl shadow-md p-6">
                        <div class="text-center mb-6">
                            <div class="w-20 h-20 bg-emerald-200 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl font-bold text-emerald-800">${user.name.charAt(0)}</div>
                            <h2 class="text-xl font-bold text-emerald-900">${user.name}</h2>
                            <p class="text-emerald-600">${user.email}</p>
                        </div>
                        <div class="space-y-3 text-sm">
                            <div class="flex items-center gap-2 text-emerald-800">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                ${user.phone || 'Sin teléfono'}
                            </div>
                            <div class="flex items-center gap-2 text-emerald-800">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                ${user.address || 'Sin dirección'}
                            </div>
                        </div>
                        <button onclick="Auth.logout()" class="w-full mt-6 bg-red-100 text-red-700 py-2 rounded-lg font-medium hover:bg-red-200 transition-colors">Cerrar Sesión</button>
                    </div>

                    <div class="lg:col-span-2">
                        <h2 class="text-2xl font-bold text-emerald-900 mb-6">Historial de Pedidos</h2>
                        ${allOrders.length > 0 ? `
                            <div class="space-y-4">
                                ${allOrders.map(order => `
                                    <div class="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition-shadow">
                                        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                                            <div>
                                                <h3 class="font-bold text-emerald-900">${order.id}</h3>
                                                <p class="text-sm text-emerald-600">${formatDate(order.date)}</p>
                                            </div>
                                            <span class="px-3 py-1 rounded-full text-sm font-medium ${getStatusColor(order.status)}">${order.status}</span>
                                        </div>
                                        <div class="flex items-center gap-2 mb-4 overflow-x-auto">
                                            ${order.items.slice(0, 4).map(item => `
                                                <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-cover rounded">
                                            `).join('')}
                                            ${order.items.length > 4 ? `<span class="text-sm text-emerald-600">+${order.items.length - 4} más</span>` : ''}
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-lg font-bold text-emerald-700">${formatPrice(order.total)}</span>
                                            <a href="pedido-detalle.html?id=${order.id}" class="text-emerald-700 font-medium hover:underline">Ver Detalle</a>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `
                            <div class="bg-white rounded-xl shadow-md p-12 text-center">
                                <div class="text-5xl mb-4">📦</div>
                                <h3 class="text-xl font-bold text-emerald-900 mb-2">No tienes pedidos aún</h3>
                                <p class="text-emerald-700 mb-6">¡Comienza a comprar y verás tu historial aquí!</p>
                                <a href="productos.html" class="bg-emerald-700 text-white px-6 py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Ver Productos</a>
                            </div>
                        `}
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
