<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Patitas Felices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-emerald-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1">
        <section class="bg-gradient-to-r from-emerald-700 to-emerald-800 text-white py-12">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <h1 class="text-4xl font-extrabold">Carrito de Compras</h1>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-4 py-8">
            <div id="cart-content"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        function renderCart() {
            const items = Cart.get();
            const container = document.getElementById('cart-content');

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <div class="text-6xl mb-4">🛒</div>
                        <h2 class="text-2xl font-bold text-emerald-900 mb-2">Tu carrito está vacío</h2>
                        <p class="text-emerald-700 mb-6">Agrega productos para comenzar tu compra</p>
                        <a href="productos.html" class="bg-emerald-700 text-white px-8 py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Ver Productos</a>
                    </div>`;
                return;
            }

            const subtotal = Cart.getTotal();
            const shipping = 2990;
            const total = subtotal + shipping;

            container.innerHTML = `
                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-4">
                        ${items.map(item => `
                            <div class="bg-white rounded-xl shadow-md p-4 flex gap-4">
                                <img src="${item.image}" alt="${item.name}" class="w-24 h-24 object-cover rounded-lg">
                                <div class="flex-1">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <h3 class="font-bold text-emerald-900">${item.name}</h3>
                                            <p class="text-emerald-700 font-bold">${formatPrice(item.price)}</p>
                                        </div>
                                        <button onclick="Cart.remove(${item.productId}); renderCart();" class="text-red-500 hover:text-red-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    </div>
                                    <div class="flex items-center gap-3 mt-3">
                                        <div class="flex items-center border border-emerald-300 rounded-lg">
                                            <button onclick="updateQty(${item.productId}, ${item.quantity - 1})" class="px-3 py-1 text-emerald-700 hover:bg-emerald-100 rounded-l-lg">−</button>
                                            <span class="px-4 py-1 border-x border-emerald-300">${item.quantity}</span>
                                            <button onclick="updateQty(${item.productId}, ${item.quantity + 1})" class="px-3 py-1 text-emerald-700 hover:bg-emerald-100 rounded-r-lg">+</button>
                                        </div>
                                        <span class="text-emerald-700 font-bold">${formatPrice(item.price * item.quantity)}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-white rounded-xl shadow-md p-6 h-fit sticky top-20">
                        <h2 class="text-xl font-bold text-emerald-900 mb-4">Resumen del Pedido</h2>
                        <div class="space-y-3 border-b border-emerald-100 pb-4 mb-4">
                            <div class="flex justify-between text-emerald-800">
                                <span>Subtotal</span>
                                <span>${formatPrice(subtotal)}</span>
                            </div>
                            <div class="flex justify-between text-emerald-800">
                                <span>Envío</span>
                                <span>${formatPrice(shipping)}</span>
                            </div>
                        </div>
                        <div class="flex justify-between text-xl font-bold text-emerald-900 mb-6">
                            <span>Total</span>
                            <span>${formatPrice(total)}</span>
                        </div>
                        <a href="checkout.html" class="block w-full bg-emerald-700 text-white text-center py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Proceder al Pago</a>
                        <a href="productos.html" class="block w-full text-center text-emerald-700 mt-3 hover:underline">Seguir Comprando</a>
                    </div>
                </div>`;
        }

        function updateQty(productId, newQty) {
            Cart.updateQuantity(productId, newQty);
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
