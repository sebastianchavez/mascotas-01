<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - Patitas Felices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-emerald-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-4 py-8">
            <nav class="text-sm text-emerald-700 mb-8">
                <a href="index.html" class="hover:text-emerald-900">Inicio</a> /
                <a href="productos.html" class="hover:text-emerald-900">Productos</a> /
                <span id="breadcrumb-name" class="text-emerald-900"></span>
            </nav>

            <div id="product-content"></div>

            <section class="mt-16">
                <h2 class="text-2xl font-bold text-emerald-900 mb-8">Productos Relacionados</h2>
                <div id="related-products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </section>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader('productos');
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        const productId = parseInt(getUrlParam('id'));
        const product = MOCK_DATA.products.find(p => p.id === productId);

        if (!product) {
            document.getElementById('product-content').innerHTML = `
                <div class="text-center py-16">
                    <div class="text-6xl mb-4">😕</div>
                    <h2 class="text-2xl font-bold text-emerald-900 mb-2">Producto no encontrado</h2>
                    <a href="productos.html" class="text-emerald-700 hover:underline">Volver a productos</a>
                </div>`;
        } else {
            document.getElementById('breadcrumb-name').textContent = product.name;
            const category = MOCK_DATA.categories.find(c => c.id === product.categoryId);
            const reviews = MOCK_DATA.reviews.filter(r => r.productId === product.id);

            document.getElementById('product-content').innerHTML = `
                <div class="grid md:grid-cols-2 gap-12">
                    <div>
                        <img src="${product.image}" alt="${product.name}" class="w-full rounded-xl shadow-lg">
                    </div>
                    <div>
                        <span class="inline-block bg-emerald-100 text-emerald-700 text-sm px-3 py-1 rounded-full mb-3">${category.icon} ${category.name}</span>
                        <h1 class="text-3xl md:text-4xl font-extrabold text-emerald-900 mb-4">${product.name}</h1>
                        <div class="flex items-center gap-3 mb-6">
                            ${renderStars(product.rating)}
                            <span class="text-emerald-700">${product.rating} (${product.reviews} reseñas)</span>
                        </div>
                        <div class="text-3xl font-bold text-emerald-700 mb-6">${formatPrice(product.price)}</div>
                        <p class="text-emerald-800 mb-6 leading-relaxed">${product.description}</p>
                        <div class="flex items-center gap-2 mb-6">
                            <span class="text-emerald-700">Stock disponible:</span>
                            <span class="font-bold ${product.stock > 10 ? 'text-green-600' : 'text-red-600'}">${product.stock} unidades</span>
                        </div>
                        <div class="flex items-center gap-4 mb-8">
                            <label class="text-emerald-800 font-medium">Cantidad:</label>
                            <div class="flex items-center border border-emerald-300 rounded-lg">
                                <button id="qty-minus" class="px-3 py-2 text-emerald-700 hover:bg-emerald-100 rounded-l-lg">−</button>
                                <input id="qty-input" type="number" value="1" min="1" max="${product.stock}" class="w-16 text-center border-x border-emerald-300 py-2 focus:outline-none">
                                <button id="qty-plus" class="px-3 py-2 text-emerald-700 hover:bg-emerald-100 rounded-r-lg">+</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-4">
                            <button id="add-to-cart" class="bg-emerald-700 text-white px-8 py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                                Agregar al Carrito
                            </button>
                            <a href="carrito.html" id="buy-now" class="bg-white text-emerald-700 border-2 border-emerald-700 px-8 py-3 rounded-lg font-bold hover:bg-emerald-100 transition-colors">Comprar Ahora</a>
                        </div>
                    </div>
                </div>

                <div class="mt-16">
                    <h2 class="text-2xl font-bold text-emerald-900 mb-6">Reseñas de Clientes</h2>
                    ${reviews.length > 0 ? `
                        <div class="space-y-4 mb-8">
                            ${reviews.map(r => `
                                <div class="bg-white rounded-xl p-6 shadow-md">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 bg-emerald-200 rounded-full flex items-center justify-center font-bold text-emerald-800">${r.userName.charAt(0)}</div>
                                            <div>
                                                <div class="font-bold text-emerald-900">${r.userName}</div>
                                                <div class="text-sm text-emerald-600">${formatDate(r.date)}</div>
                                            </div>
                                        </div>
                                        ${renderStars(r.rating)}
                                    </div>
                                    <p class="text-emerald-800">${r.comment}</p>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p class="text-emerald-700 mb-8">Aún no hay reseñas para este producto.</p>'}
                    <a href="resena.html?productId=${product.id}" class="inline-block bg-emerald-700 text-white px-6 py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Escribir una Reseña</a>
                </div>
            `;

            document.getElementById('qty-minus').addEventListener('click', () => {
                const input = document.getElementById('qty-input');
                if (parseInt(input.value) > 1) input.value = parseInt(input.value) - 1;
            });

            document.getElementById('qty-plus').addEventListener('click', () => {
                const input = document.getElementById('qty-input');
                if (parseInt(input.value) < product.stock) input.value = parseInt(input.value) + 1;
            });

            document.getElementById('add-to-cart').addEventListener('click', () => {
                const qty = parseInt(document.getElementById('qty-input').value);
                Cart.add(product.id, qty);
            });

            document.getElementById('buy-now').addEventListener('click', (e) => {
                e.preventDefault();
                const qty = parseInt(document.getElementById('qty-input').value);
                const items = Cart.get();
                const existing = items.find(i => i.productId === product.id);
                if (!existing) {
                    Cart.add(product.id, qty);
                } else {
                    Cart.updateQuantity(product.id, qty);
                }
                window.location.href = 'carrito.html';
            });

            const related = MOCK_DATA.products.filter(p => p.categoryId === product.categoryId && p.id !== product.id).slice(0, 4);
            document.getElementById('related-products').innerHTML = related.map(p => renderProductCard(p)).join('');
        }
    </script>
</body>
</html>
