<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Patitas Felices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-emerald-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1 flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="text-center mb-8">
                    <div class="text-4xl mb-2">🐾</div>
                    <h1 class="text-2xl font-bold text-emerald-900">Crear Cuenta</h1>
                    <p class="text-emerald-700 mt-1">Únete a la familia Patitas Felices</p>
                </div>

                <form id="register-form" class="space-y-4">
                    <div>
                        <label class="block text-emerald-800 font-medium mb-1">Nombre completo</label>
                        <input type="text" required class="w-full px-4 py-3 border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Tu nombre completo">
                    </div>
                    <div>
                        <label class="block text-emerald-800 font-medium mb-1">Email</label>
                        <input type="email" required class="w-full px-4 py-3 border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="tu@email.com">
                    </div>
                    <div>
                        <label class="block text-emerald-800 font-medium mb-1">Teléfono</label>
                        <input type="tel" class="w-full px-4 py-3 border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="+56 9 5678 1234">
                    </div>
                    <div>
                        <label class="block text-emerald-800 font-medium mb-1">Contraseña</label>
                        <input type="password" required minlength="6" class="w-full px-4 py-3 border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div>
                        <label class="block text-emerald-800 font-medium mb-1">Confirmar Contraseña</label>
                        <input type="password" required minlength="6" class="w-full px-4 py-3 border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Repite tu contraseña">
                    </div>
                    <label class="flex items-start gap-2 text-emerald-800 cursor-pointer">
                        <input type="checkbox" required class="mt-1 rounded text-emerald-700">
                        <span class="text-sm">Acepto los <a href="terminos.html" class="text-emerald-700 font-bold hover:underline">Términos y Condiciones</a> y la <a href="privacidad.html" class="text-emerald-700 font-bold hover:underline">Política de Privacidad</a></span>
                    </label>
                    <button type="submit" class="w-full bg-emerald-700 text-white py-3 rounded-lg font-bold hover:bg-emerald-800 transition-colors">Crear Cuenta</button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-emerald-700">¿Ya tienes cuenta? <a href="login.html" class="text-emerald-700 font-bold hover:underline">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        if (Auth.isLoggedIn()) {
            window.location.href = 'perfil.html';
        }

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const name = inputs[0].value;
            const email = inputs[1].value;
            const phone = inputs[2].value;
            const password = inputs[3].value;
            const confirmPassword = inputs[4].value;

            if (password !== confirmPassword) {
                showToast('Las contraseñas no coinciden', 'error');
                return;
            }

            const result = Auth.register(name, email, password, phone);
            if (result.success) {
                showToast('¡Cuenta creada exitosamente! Bienvenido ' + name, 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else {
                showToast(result.message, 'error');
            }
        });
    </script>
</body>
</html>
